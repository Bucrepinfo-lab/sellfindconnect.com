# DigitalOcean App Platform spec for Sell Find Connect (sellfindconnect.com).
#
# Usage:
#   doctl apps create --spec deploy/digitalocean/app.yaml
#   doctl apps update <APP_ID> --spec deploy/digitalocean/app.yaml
#
# Model: ONE app, path-based routing (App Platform routes by path, not by host).
#   web -> https://sellfindconnect.com/
#   api -> https://sellfindconnect.com/api  (prefix stripped; NestJS sees /v1/...)
# So the public API base is https://sellfindconnect.com/api/v1.
# A two-app, api.sellfindconnect.com subdomain layout is the documented
# alternative — see docs/DIGITALOCEAN_DEPLOYMENT.md.
#
# Secrets (type: SECRET) must be set in the DO dashboard or via `doctl` — never
# commit real values.
name: sellfindconnect
region: # set to the closest available region (e.g. fra1) until a ZA PoP exists
features:
  - buildpack-stack=ubuntu-22

domains:
  - domain: sellfindconnect.com
    type: PRIMARY
    zone: sellfindconnect.com
  - domain: www.sellfindconnect.com
    type: ALIAS

databases:
  - name: sfc-postgres
    engine: PG
    version: "16"
    production: true

services:
  # ---------------------------------------------------------------------------
  # Next.js web / PWA  ->  https://sellfindconnect.com/
  # ---------------------------------------------------------------------------
  - name: web
    dockerfile_path: deploy/web.Dockerfile
    source_dir: /
    github:
      repo: Bucrepinfo-lab/sellfindconnect.com
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /
    health_check:
      http_path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        # Build-time + runtime API base (path-routed through the same domain).
        value: https://sellfindconnect.com/api/v1
        scope: BUILD_AND_RUN_TIME

  # ---------------------------------------------------------------------------
  # NestJS API  ->  https://sellfindconnect.com/api  (NestJS global prefix: v1)
  # The /api prefix is stripped before forwarding, so the API receives /v1/...
  # ---------------------------------------------------------------------------
  - name: api
    dockerfile_path: deploy/api.Dockerfile
    source_dir: /
    github:
      repo: Bucrepinfo-lab/sellfindconnect.com
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /api
        preserve_path_prefix: false
    health_check:
      http_path: /v1/health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: WEB_ORIGIN
        value: https://sellfindconnect.com
      - key: DATABASE_URL
        value: ${sfc-postgres.DATABASE_URL}
        scope: RUN_TIME
      - key: AUTH_REPOSITORY
        value: prisma
      - key: PROFILE_REPOSITORY
        value: prisma
      - key: ANALYTICS_REPOSITORY
        value: prisma
      - key: PAYMENT_PROVIDER
        value: manual # switch to a live provider only after finance approval
      - key: INTERNAL_JOB_KEY
        type: SECRET
        value: REPLACE_WITH_LONG_RANDOM_SECRET
      # Optional once enabled (DigitalOcean Spaces media storage / durable queue):
      # - key: MEDIA_STORAGE_DRIVER
      #   value: s3
      # - key: MEDIA_S3_ENDPOINT
      #   value: https://<region>.digitaloceanspaces.com
      # - key: MEDIA_S3_BUCKET
      #   value: sellfindconnect-media
      # - key: MEDIA_S3_ACCESS_KEY_ID
      #   type: SECRET
      # - key: MEDIA_S3_SECRET_ACCESS_KEY
      #   type: SECRET
      # - key: MEDIA_JOB_QUEUE_DRIVER
      #   value: prisma

# Database migrations run automatically before each deploy.
jobs:
  - name: db-migrate
    kind: PRE_DEPLOY
    dockerfile_path: deploy/api.Dockerfile
    source_dir: /
    github:
      repo: Bucrepinfo-lab/sellfindconnect.com
      branch: main
    run_command: npm run db:migrate:deploy
    envs:
      - key: DATABASE_URL
        value: ${sfc-postgres.DATABASE_URL}
        scope: RUN_TIME
