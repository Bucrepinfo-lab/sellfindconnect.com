<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · SellFindConnect</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f5;color:#1d2425;font-family:Inter,ui-sans-serif,system-ui,sans-serif;padding:16px;box-sizing:border-box}
  main{max-width:420px;text-align:left}
  img{width:56px;height:56px;border-radius:12px}
  h1{font-size:24px;margin:20px 0 8px}
  p{color:#687172;line-height:1.5;margin:0 0 20px}
  button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:#1d4f45;color:#fff;font:inherit;font-weight:700}
  button:focus-visible{outline:3px solid #c99a2e;outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>SellFindConnect needs a connection to search and send messages. Check your data or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
