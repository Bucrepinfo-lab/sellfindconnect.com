# Fly.io — SellFindConnect API (NestJS)  ·  deploy: fly deploy --config fly.api.toml --remote-only
# Distilled from the Telpen Edu playbook. Run from the repo root.
app = "sellfindconnect-api"
primary_region = "fra"

[build]
dockerfile = "deploy/api.Dockerfile"

[env]
PORT = "8080"
NODE_ENV = "production"
# WEB_ORIGIN + repository/provider flags are set via `fly secrets` (see deploy notes).

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "20s"
method = "GET"
path = "/v1/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
