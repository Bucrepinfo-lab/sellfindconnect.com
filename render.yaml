services:
  - type: web
    name: sellfindconnect-api
    runtime: node
    plan: standard
    region: frankfurt
    repo: https://github.com/Bucrepinfo-lab/sellfindconnect.com.git
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start --workspace=@telpen/api
    healthCheckPath: /v1/health
    domains:
      - api.sellfindconnect.com
    buildFilter:
      paths:
        - apps/api/**
        - packages/domain/**
        - packages/database/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://sellfindconnect.com
      - key: AUTH_REPOSITORY
        value: memory
      - key: DATABASE_URL
        fromDatabase:
          name: sellfindconnect-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: sellfindconnect-keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: sellfindconnect-keyvalue
          property: port
      - key: INTERNAL_JOB_KEY
        generateValue: true

  - type: web
    name: sellfindconnect-web
    runtime: node
    plan: standard
    region: frankfurt
    repo: https://github.com/Bucrepinfo-lab/sellfindconnect.com.git
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start --workspace=@telpen/web
    healthCheckPath: /
    domains:
      - sellfindconnect.com
      - www.sellfindconnect.com
    buildFilter:
      paths:
        - apps/web/**
        - packages/domain/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://api.sellfindconnect.com/v1

  - type: cron
    name: sellfindconnect-advert-lifecycle
    runtime: node
    plan: starter
    region: frankfurt
    repo: https://github.com/Bucrepinfo-lab/sellfindconnect.com.git
    branch: main
    autoDeployTrigger: commit
    schedule: '15 1 * * *'
    buildCommand: npm ci
    startCommand: node scripts/render/run-internal-job.mjs operations/adverts/lifecycle/run
    envVars:
      - key: INTERNAL_API_BASE_URL
        value: https://api.sellfindconnect.com/v1
      - key: INTERNAL_JOB_KEY
        sync: false

  - type: cron
    name: sellfindconnect-conversation-sla
    runtime: node
    plan: starter
    region: frankfurt
    repo: https://github.com/Bucrepinfo-lab/sellfindconnect.com.git
    branch: main
    autoDeployTrigger: commit
    schedule: '*/15 * * * *'
    buildCommand: npm ci
    startCommand: node scripts/render/run-internal-job.mjs operations/conversations/sla/run
    envVars:
      - key: INTERNAL_API_BASE_URL
        value: https://api.sellfindconnect.com/v1
      - key: INTERNAL_JOB_KEY
        sync: false

  - type: keyvalue
    name: sellfindconnect-keyvalue
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: sellfindconnect-postgres
    databaseName: sellfindconnect
    user: sellfindconnect_app
    plan: pro-4gb
    region: frankfurt
    diskSizeGB: 20
    storageAutoscalingEnabled: true
    highAvailability:
      enabled: true
    ipAllowList: []
