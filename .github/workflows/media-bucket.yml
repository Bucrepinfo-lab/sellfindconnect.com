name: Picture store — check, or make public (manual)

# Owner 27/11/26: advert photos and business logos are public on the site, so
# their store should be publicly readable (same decision as HarvestHub, where a
# private Tigris bucket made every photo answer 403). Private files (IDs, tax
# documents) must never be put in this bucket.
#
# make_public=false: report the store settings (names only, never keys) and
#                    whether the public can read it (a missing file answers
#                    404 when open, 403 when closed).
# make_public=true : also `fly storage update <bucket> --public`, then re-check.

on:
  workflow_dispatch:
    inputs:
      make_public:
        description: "Make the picture store public"
        type: boolean
        default: false
      create_store:
        description: "Create the public picture store for the API (only if none exists)"
        type: boolean
        default: false

concurrency:
  group: media-bucket
  cancel-in-progress: false

jobs:
  bucket:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sellfindconnect-api
    steps:
      - name: Check Fly token
        run: test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN not set"; exit 1; }
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the public picture store
        if: ${{ inputs.create_store }}
        run: |
          # Owner 27/11/26: production had no store (photos went to a placeholder
          # address). Fly creates a public Tigris bucket and sets its settings
          # (AWS_*, BUCKET_NAME) as secrets on the API, which restarts it; the
          # API reads those names (media.adapters.ts). No key passes through here.
          flyctl storage create --public -n sellfindconnect-media -a "$APP" -y
          sleep 20
      - name: Report store settings
        id: report
        run: |
          out=$(flyctl ssh console -a "$APP" -C "printenv MEDIA_STORAGE_DRIVER MEDIA_S3_ENDPOINT MEDIA_S3_BUCKET MEDIA_S3_PUBLIC_BASE_URL AWS_ENDPOINT_URL_S3 BUCKET_NAME" || true)
          echo "$out"
          driver=$(flyctl ssh console -a "$APP" -C "printenv MEDIA_STORAGE_DRIVER" 2>/dev/null | tr -d '\r' || true)
          bucket=$(flyctl ssh console -a "$APP" -C "sh -c 'echo \${MEDIA_S3_BUCKET:-\$BUCKET_NAME}'" 2>/dev/null | tr -d '\r' || true)
          endpoint=$(flyctl ssh console -a "$APP" -C "sh -c 'echo \${MEDIA_S3_ENDPOINT:-\$AWS_ENDPOINT_URL_S3}'" 2>/dev/null | tr -d '\r' || true)
          base=$(flyctl ssh console -a "$APP" -C "printenv MEDIA_S3_PUBLIC_BASE_URL" 2>/dev/null | tr -d '\r' || true)
          # Tigris serves a public bucket only at the bucket's own host.
          if [ -z "$base" ] && [ -n "$bucket" ]; then
            case "$endpoint" in
              *fly.storage.tigris.dev*) base="https://$bucket.fly.storage.tigris.dev" ;;
              *t3.storage.dev*) base="https://$bucket.t3.tigrisfiles.io" ;;
              *) base="${endpoint%/}/$bucket" ;;
            esac
          fi
          echo "driver=${driver:-(auto)} bucket=${bucket:-(none: development storage, uploads are not kept)}"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Can the public read it?
        if: ${{ steps.report.outputs.base != '' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.report.outputs.base }}/sfc-public-probe-does-not-exist")
          echo "missing-file probe: $code (404 = open to the public, 403 = closed)"
      - name: Make public
        if: ${{ inputs.make_public && steps.report.outputs.bucket != '' }}
        run: |
          flyctl storage update "${{ steps.report.outputs.bucket }}" --public
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.report.outputs.base }}/sfc-public-probe-does-not-exist")
          echo "after: missing-file probe $code (404 = open)"
