name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma engine checksums can 403 on some networks; never block CI on it.
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared domain package
        run: npm run build:domain

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck (domain + api + web)
        run: npm run typecheck

      - name: Unit tests (domain + api)
        run: npm test

      - name: Lint (web)
        run: npm run lint

      - name: Production build (api + web)
        run: npm run build
        env:
          NODE_ENV: production
