name: Scheduled jobs

# Production scheduler for Sell Find Connect. Fly.io has no app-level cron in
# the checked-in toml files, so GitHub Actions triggers the protected
# internal maintenance endpoints (guarded by x-internal-job-key).
#
# Cron runs only after this workflow is on the default branch (main).
# Set repository secrets before merge so the first scheduled run can succeed:
#   API_BASE_URL      https://api.sellfindconnect.com/v1
#   INTERNAL_JOB_KEY  the same secret set on the Fly API app
#
# Note: cron times are UTC. GitHub may delay scheduled runs under load.

on:
  schedule:
    - cron: '*/15 * * * *' # frequent: conversation SLA + media + notifications
    - cron: '0 2 * * *'    # daily: advert lifecycle + privacy + analytics + finance
    - cron: '0 3 * * 0'    # weekly: analytics retention sweep
  workflow_dispatch:
    inputs:
      group:
        description: Which group to run manually
        type: choice
        default: all
        options: [all, frequent, daily, weekly]

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Run scheduled maintenance jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      INTERNAL_JOB_KEY: ${{ secrets.INTERNAL_JOB_KEY }}
      FREQUENT: ${{ github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'frequent')) }}
      DAILY: ${{ github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'daily')) }}
      WEEKLY: ${{ github.event.schedule == '0 3 * * 0' || (github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'weekly')) }}
    steps:
      - name: Validate secrets
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$INTERNAL_JOB_KEY" ]; then
            echo "::error::Set the API_BASE_URL and INTERNAL_JOB_KEY repository secrets."
            exit 1
          fi

      - name: Conversation SLA sweep
        if: env.FREQUENT == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/conversations/sla/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" -d '{}'

      - name: Notification dispatch retry
        if: env.FREQUENT == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/notifications/dispatch/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" -d '{}'

      - name: Media processing tick
        if: env.FREQUENT == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/media/processing/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" \
            -d '{"workerId":"github-scheduler","limit":25}'

      - name: Source Finder opportunity alerts
        if: env.FREQUENT == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/source-finder/alerts/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" -d '{}'

      - name: Advert lifecycle (day-35/39 alerts, day-40 delete)
        if: env.DAILY == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/adverts/lifecycle/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" -d '{}'

      - name: Account deletion grace-period sweep
        if: env.DAILY == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/privacy/deletions/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" -d '{}'

      - name: Analytics warehouse rollups
        if: env.DAILY == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/analytics/rollups/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" -d '{}'

      - name: Finance remittance alerts (all tenants)
        if: env.DAILY == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/finance/alerts/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" -d '{}'

      - name: Analytics retention sweep
        if: env.WEEKLY == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            "$API_BASE_URL/operations/analytics/retention/run" \
            -H "x-internal-job-key: $INTERNAL_JOB_KEY" \
            -H "content-type: application/json" -d '{}'
