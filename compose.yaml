name: telpen-adverts

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telpen_adverts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telpen_adverts"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - telpen-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - telpen-redis:/data

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: telpen-local-search-key
    ports:
      - "7700:7700"
    volumes:
      - telpen-meilisearch:/meili_data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  telpen-postgres:
  telpen-redis:
  telpen-meilisearch:

